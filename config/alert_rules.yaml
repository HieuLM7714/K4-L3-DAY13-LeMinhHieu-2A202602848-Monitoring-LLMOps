alerts:
  - name: high_latency_p95
    severity: warning
    condition: "percentile(latency_ms, 95) > 3000"
    duration: "5m"
    type: symptom-based
    channel: slack
    owner: sre-oncall
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: "error_rate_pct > 2"
    duration: "3m"
    type: symptom-based
    channel: slack
    owner: sre-oncall
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success
    severity: warning
    condition: "tool_success_rate_pct < 90"
    duration: "5m"
    type: symptom-based
    channel: slack
    owner: rag-platform-team
    runbook: docs/alerts.md#alert-3

